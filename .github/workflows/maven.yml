# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    # checks: write lets the test report action publish results on commits and PRs
    permissions:
      contents: read
      checks: write

    defaults:
      run:
        working-directory: java-assignment

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
        cache-dependency-path: java-assignment/pom.xml
    - name: Build the app
      run: mvn --batch-mode --update-snapshots -DskipTests package
    - name: Run the Maven verify phase
      run: mvn --batch-mode verify

    # Show test results (passed/failed tests with messages) as a check on the commit / PR
    - name: Publish test results
      if: always()
      uses: mikepenz/action-junit-report@v5
      with:
        report_paths: |
          java-assignment/target/surefire-reports/TEST-*.xml
          java-assignment/target/failsafe-reports/TEST-*.xml
        check_name: Test results
        include_passed: true
        detailed_summary: true

    # Keep the raw test reports and the JaCoCo coverage report downloadable from the run
    - name: Upload test reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-reports
        path: |
          java-assignment/target/surefire-reports/
          java-assignment/target/failsafe-reports/
        if-no-files-found: ignore

    - name: Upload JaCoCo coverage report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: jacoco-report
        path: java-assignment/target/site/jacoco/
        if-no-files-found: warn
